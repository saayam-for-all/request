spring.datasource.url=jdbc:postgresql://<your-database-url>:5432/<your-database-name>
spring.datasource.username=<your-username>
spring.datasource.password=<your-password>

# --- AWS / notifications -------------------------------------------------
# Supplied by the runtime environment. See docs/notification-runtime-setup.md.
# In AWS these resolve from Lambda env vars; credentials come from the IAM role.
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.stack.auto=false

# SQS queue the request service publishes notification events to.
sqs.url=${AWS_SQS_NOTIFICATION_QUEUE_URL:}

# Verified SES sender identity used for outbound email notifications.
ses.sender.email=${AWS_SES_SENDER_EMAIL:}

# Retained for compatibility; direct SMS/push sends use the recipient address.
sns.topic.arn=${AWS_SNS_TOPIC_ARN:}

# Set ONLY when running against a local AWS emulator, e.g. http://localhost:4566.
# Empty in AWS, which selects the real regional endpoints and the IAM role.
aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}

# --- Volunteer matching --------------------------------------------------
# IN_PERSON requests route by proximity to the requester; REMOTE requests route
# by skill. These two settings only affect the proximity path.

# Outer search radius in metres. 25 km is a plausible "can travel to help" range
# for an urban area; tune per region once there is real location data.
saayam.matching.in-person.radius-meters=${MATCHING_IN_PERSON_RADIUS_METERS:25000}

# Cap on how many nearby volunteers are notified for a single in-person request,
# nearest first. Answers ba#40 open decision D6 with a default rather than
# broadcasting to everyone in radius.
saayam.matching.in-person.max-volunteers=${MATCHING_IN_PERSON_MAX_VOLUNTEERS:25}

# --- Sentiment analysis --------------------------------------------------
# Only GOOD_REQUEST (code 0) is routed to volunteers; foul (1), depressive or
# suicidal (2) and threatening (3) requests are never notified. Codes mirror the
# seeded sentiment_codes lookup table.
#
# Each lexicon is a comma-separated, whole-word term list. Leave a key unset to
# use the built-in default in LexiconSentimentAnalysisService. These exist so
# operations can tune the lists without a code change; the model-backed
# classifier tracked by saayam-for-all/ai#7 supersedes them entirely.
saayam.sentiment.lexicon.threatening=${SENTIMENT_LEXICON_THREATENING:}
saayam.sentiment.lexicon.depressive=${SENTIMENT_LEXICON_DEPRESSIVE:}
saayam.sentiment.lexicon.foul=${SENTIMENT_LEXICON_FOUL:}

spring.datasource.url=${DB_DEV_HOST_URL}
spring.datasource.username=${DB_DEV_USERNAME}
spring.datasource.password=${DB_DEV_PASSWORD}

spring.main.lazy-initialization=true
spring.datasource.hikari.initializationFailTimeout=-1
spring.datasource.hikari.minimum-idle=0

# Write all timestamps as UTC wall-clock. The timestamp columns are TIMESTAMP
# WITHOUT TIME ZONE and the notification watermark contract is GMT, so this must not
# depend on the JVM's default zone. Without it, a service running in a non-UTC zone
# writes local time and cross-service timestamp comparisons silently break.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

spring.main.banner-mode=off

spring.messages.basename=lang/saayam_messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
