# Controlled local demo environment. Points the service at the Postgres and
# LocalStack containers from demo/docker-compose.demo.yml. Never used in AWS.

spring.datasource.url=jdbc:postgresql://localhost:55432/saayam
spring.datasource.username=saayam
spring.datasource.password=saayam
spring.datasource.driver-class-name=org.postgresql.Driver

# The demo schema is created by the container init scripts, exactly as the deployed
# RDS instance is managed outside the application.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.properties.hibernate.default_schema=virginia_dev_saayam_rdbms
spring.main.lazy-initialization=false

cloud.aws.region.static=us-east-1
aws.endpoint-override=http://localhost:4566
sqs.url=http://localhost:4566/000000000000/saayam-notifications
ses.sender.email=no-reply@saayam.test
sns.topic.arn=

logging.level.org.sfa.request=INFO

# notifications.status is the PostgreSQL enum status_type, which lives inside the
# virginia_dev_saayam_rdbms schema. The write cast on Notification.status is
# unqualified, so the schema must be on the connection's search_path for the type
# to resolve. Deployed environments need the equivalent -- either this property or
# ?currentSchema=<schema> on the JDBC URL.
spring.datasource.hikari.connection-init-sql=SET search_path TO virginia_dev_saayam_rdbms, public
