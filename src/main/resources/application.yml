spring:
  application:
    name: request-service
  datasource:
    url: jdbc:postgresql://localhost:5432/saayam
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

aws:
  region: ${AWS_REGION}
  s3:
    fraud-bucket: ${AWS_FRAUD_BUCKET}

server:
  port: 8080
  servlet:
    context-path: / 