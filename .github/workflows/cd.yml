
name: Request CD - Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'saayam-for-all/request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: request_test
          POSTGRES_USER: request_test
          POSTGRES_PASSWORD: request_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_test -d request_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_DEV_HOST_URL: jdbc:postgresql://localhost:5432/request_test
      DB_DEV_USERNAME: request_test
      DB_DEV_PASSWORD: request_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test application
        run: ./mvnw -B clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
