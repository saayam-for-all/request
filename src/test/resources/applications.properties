# DB - from your docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/saayam
spring.datasource.username=lydialu
spring.datasource.password=qweasd

# AWS - dummy values just to stop Spring complaining
cloud.aws.credentials.access-key=test
cloud.aws.credentials.secret-key=test
cloud.aws.region.static=us-east-1
cloud.aws.stack.auto=false

sqs.url=https://sqs.us-east-1.amazonaws.com/test/test
sns.topic.arn=arn:aws:sns:us-east-1:123456789:test

# rest same as main
spring.main.lazy-initialization=true
spring.datasource.hikari.initializationFailTimeout=-1
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

spring.main.banner-mode=off

spring.messages.basename=lang/saayam_messages
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always